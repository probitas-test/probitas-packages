name: Publish

# The only workflow that publishes the packages. npm trusted publishing ties
# each package to a single workflow file, so releases and prereleases share
# this one.
#
# - A published GitHub Release with a calendar tag (v20261008.01) releases
#   every package changed since the previous release to npm (`latest`) and
#   JSR, with versions decided by scripts/release_plan.ts. The plan is
#   attached to the Release as versions.json and reused on re-runs, so a
#   failed run never bumps a version twice.
# - A GitHub Release marked as a pre-release is a dry run: the plan is
#   computed and attached, nothing is published. Pre-releases do not become
#   the "latest" release, so they are safe for trying the workflow out.
# - Running the workflow manually publishes the planned versions as
#   `<version>-next.<run number>` under npm's `next` dist-tag, so downstream
#   repositories (probitas) can depend on unreleased changes.

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write # attach versions.json and edit the release notes
  id-token: write # npm trusted publishing and JSR OIDC

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      PLAN: ${{ runner.temp }}/versions.json
      NOTES: ${{ runner.temp }}/notes.md
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0 # the plan compares against the previous release tag

      - uses: nixbuild/nix-quick-install-action@v34
      - run: nix develop -c bun install --frozen-lockfile
      - run: nix develop -c bun run check

      - name: Decide what to publish
        id: mode
        env:
          EVENT: ${{ github.event_name }}
          TAG: ${{ github.event.release.tag_name }}
          PRERELEASE: ${{ github.event.release.prerelease }}
        run: |
          if [ "$EVENT" = "release" ]; then
            case "$TAG" in
              v[0-9][0-9][0-9][0-9][0-9][0-9][0-9][0-9].[0-9][0-9]) ;;
              *) echo "::error::Release tags look like v20261008.01, got $TAG"; exit 1 ;;
            esac
            echo "tag=$TAG" >> "$GITHUB_OUTPUT"
            echo "dist-tag=latest" >> "$GITHUB_OUTPUT"
            echo "dry-run=$PRERELEASE" >> "$GITHUB_OUTPUT"
          else
            echo "tag=$GITHUB_SHA" >> "$GITHUB_OUTPUT"
            echo "dist-tag=next" >> "$GITHUB_OUTPUT"
            echo "dry-run=false" >> "$GITHUB_OUTPUT"
          fi
          # Newest published, non-pre-release Release other than this one.
          previous=$(gh release list --exclude-drafts --exclude-pre-releases \
            --limit 100 --json tagName --jq ".[].tagName | select(. != \"$TAG\")" | head -n 1)
          echo "previous=$previous" >> "$GITHUB_OUTPUT"
          echo "Previous release: ${previous:-(none)}"

      - name: Plan versions
        env:
          EVENT: ${{ github.event_name }}
          TAG: ${{ steps.mode.outputs.tag }}
          PREVIOUS: ${{ steps.mode.outputs.previous }}
        run: |
          if [ "$EVENT" = "release" ] &&
            gh release download "$TAG" --pattern versions.json --output "$PLAN" 2>/dev/null; then
            echo "Reusing the plan attached to $TAG"
            exit 0
          fi
          nix develop -c bun scripts/release_plan.ts --tag "$TAG" --previous "$PREVIOUS" \
            --out "$PLAN" --notes "$NOTES"
          if [ "$EVENT" = "release" ]; then
            gh release upload "$TAG" "$PLAN"
            gh release view "$TAG" --json body --jq .body > "$RUNNER_TEMP/body.md"
            printf '\n\n' >> "$RUNNER_TEMP/body.md"
            cat "$NOTES" >> "$RUNNER_TEMP/body.md"
            gh release edit "$TAG" --notes-file "$RUNNER_TEMP/body.md"
          fi

      - name: Apply versions
        if: steps.mode.outputs.dry-run != 'true'
        run: |
          if [ "${{ steps.mode.outputs.dist-tag }}" = "next" ]; then
            nix develop -c bun scripts/apply_versions.ts --plan "$PLAN" --suffix "next.${{ github.run_number }}"
          else
            nix develop -c bun scripts/apply_versions.ts --plan "$PLAN"
          fi
          nix develop -c bun run build
          nix develop -c bun run pack
          nix develop -c bun run jsr:sync

      - uses: actions/setup-node@v5
        if: steps.mode.outputs.dry-run != 'true'
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      # npm trusted publishing (GitHub OIDC) needs npm 11.5.1 or later; every
      # package lists this workflow as its trusted publisher on npmjs.com.
      - if: steps.mode.outputs.dry-run != 'true'
        run: npm install -g npm@^11.5.1

      - name: Publish
        if: steps.mode.outputs.dry-run != 'true'
        run: nix develop -c bun scripts/publish.ts --plan "$PLAN" --dist-tag "${{ steps.mode.outputs.dist-tag }}"
