name: Publish next

# Publishes every package to npm as <version>-next.<run number> under the
# `next` dist-tag, so downstream repositories (probitas) can depend on
# unreleased changes. Releases proper are a separate workflow.

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # npm provenance / trusted publishing

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: nixbuild/nix-quick-install-action@v34

      - run: nix develop -c bun install --frozen-lockfile
      - run: nix develop -c bun run check
      - run: nix develop -c bun scripts/set_prerelease.ts next.${{ github.run_number }}
      - run: nix develop -c bun run build
      - run: nix develop -c bun run pack

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      # Publishing authenticates through npm trusted publishing (GitHub OIDC),
      # so no npm token is stored in the repository. Every package must list
      # this workflow as its trusted publisher on npmjs.com, and the npm CLI
      # must be 11.5.1 or later.
      - run: npm install -g npm@^11.5.1

      - name: Publish tarballs
        run: |
          for tarball in ./dist-pack/*.tgz; do
            npm publish "$tarball" --tag next --access public
          done
